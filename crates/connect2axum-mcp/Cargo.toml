[package]
name = "connect2axum-mcp"
version = "0.1.0"
description = "Runtime for generated MCP (Model Context Protocol) tool wrappers over ConnectRPC services"
readme = "../../README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version = "1.88"
documentation = "https://docs.rs/connect2axum-mcp"
keywords = ["mcp", "axum", "connectrpc", "protobuf", "ai"]
categories = ["network-programming", "web-programming"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
axum.workspace = true
buffa.workspace = true
connect2axum = { path = "../connect2axum", version = "0.4.2" }
connectrpc.workspace = true
flexstr.workspace = true
futures-util.workspace = true
http.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
uni_error.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
