version: v2
clean: true
plugins:
  - local: protoc-gen-buffa
    out: src/generated/buffa
    opt:
      - json=true
  - local: protoc-gen-buffa-packaging
    out: src/generated/buffa
    strategy: all
  - local: protoc-gen-connect-rust
    out: src/generated/connect
    opt:
      - buffa_module=crate::proto
  - local: protoc-gen-buffa-packaging
    out: src/generated/connect
    strategy: all
    opt:
      - filter=services
  - local: protoc-gen-connect2rest
    out: src/generated/connect2axum
    opt:
      - buffa_module=crate::proto
      - connect_module=crate::connect
  - local: protoc-gen-connect2mcp
    out: src/generated/connect2axum
    # One run over every file, so connect2mcp.yaml entries are checked against
    # all of them rather than one directory at a time.
    strategy: all
    opt:
      - buffa_module=crate::proto
      - connect_module=crate::connect
      - config=connect2mcp.yaml
